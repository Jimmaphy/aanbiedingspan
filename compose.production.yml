services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is verplicht}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/caddy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is verplicht}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is verplicht}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is verplicht}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is verplicht}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is verplicht}
      ADMIN_ROLE: ${ADMIN_ROLE:-admin}
      LOG_LEVEL: ${LOG_LEVEL:-notice}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - recipe-uploads:/app/Public/uploads/recipes

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is verplicht}
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME is verplicht}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is verplicht}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  recipe-uploads:
