services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aanbiedingspan
      POSTGRES_USER: aanbiedingspan
      POSTGRES_PASSWORD: development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aanbiedingspan -d aanbiedingspan"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
